<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentMemory Data Viewer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-soft: #fbfcfe;
      --ink: #111827;
      --ink-muted: #64748b;
      --ink-faint: #94a3b8;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --active: #2563eb;
      --active-soft: #eff6ff;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --ui: Inter, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 14px;
    }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 24px;
      background: #111827;
      color: #fff;
      flex-shrink: 0;
    }
    .brand { display: flex; flex-direction: column; min-width: 230px; }
    .brand strong { font-size: 18px; letter-spacing: 0; }
    .brand span { color: #cbd5e1; font-size: 11px; margin-top: 2px; }
    .top-tabs { display: flex; align-items: center; gap: 8px; overflow-x: auto; min-width: 0; flex: 1; }
    .top-tabs button, .top-tabs a {
      height: 34px;
      border: 1px solid #374151;
      border-radius: 5px;
      background: #263244;
      color: #fff;
      padding: 0 14px;
      font: 600 13px var(--ui);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }
    .top-tabs button.active { background: var(--active); border-color: var(--active); }
    .top-tabs a { margin-left: auto; background: transparent; }
    .status-line {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-light);
      background: var(--panel);
      color: var(--ink-muted);
      flex-shrink: 0;
    }
    .status-line strong { color: var(--ink); }
    .viewer-body { padding: 24px; min-height: 0; flex: 1; }
    .grid { display: grid; gap: 18px; min-height: calc(100vh - 154px); }
    .grid.sessions { grid-template-columns: minmax(270px, 330px) minmax(260px, 330px) minmax(420px, 1fr); }
    .grid.two-col { grid-template-columns: minmax(330px, 420px) minmax(520px, 1fr); }
    .pane {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 7px;
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .pane-head {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border-light);
      background: var(--panel-soft);
      flex-shrink: 0;
    }
    .pane-title { font-size: 17px; font-weight: 700; margin: 0; }
    .pane-sub { margin-top: 5px; color: var(--ink-muted); font-size: 12px; line-height: 1.35; }
    .pane-tools { padding: 12px 20px; border-bottom: 1px solid var(--border-light); background: var(--panel); }
    .search {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0 12px;
      font: 13px var(--ui);
      color: var(--ink);
      background: #fff;
    }
    .list { padding: 14px; overflow: auto; min-height: 0; flex: 1; }
    .row {
      width: 100%;
      text-align: left;
      display: block;
      border: 1px solid var(--border-light);
      background: var(--panel);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 10px;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }
    .row:hover { border-color: #93c5fd; }
    .row.active { background: var(--active-soft); border-color: #93c5fd; }
    .row-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
    .row-meta { margin-top: 6px; color: var(--ink-muted); font-size: 12px; line-height: 1.35; }
    .row-body { margin-top: 8px; color: #334155; font-size: 13px; line-height: 1.45; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 9px;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      background: #eef2ff;
      color: #334155;
      font-size: 11px;
      font-family: var(--mono);
    }
    .badge.green { background: var(--green-soft); border-color: var(--green-border); }
    .badge.amber { background: var(--amber-soft); border-color: var(--amber-border); }
    .detail {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      padding: 16px;
      margin-bottom: 12px;
    }
    .detail h3 { margin: 0 0 10px; font-size: 16px; }
    .section { margin-top: 14px; }
    .section-title { font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--ink-muted); letter-spacing: 0.05em; margin-bottom: 7px; }
    .text-block {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--panel);
      border: 1px solid var(--border-light);
      border-radius: 5px;
      padding: 10px 12px;
      line-height: 1.5;
      max-height: 220px;
      overflow: auto;
    }
    details.raw {
      margin-top: 14px;
      border: 1px solid var(--border-light);
      border-radius: 5px;
      background: var(--panel);
    }
    details.raw summary { cursor: pointer; padding: 10px 12px; font-weight: 700; color: var(--ink-muted); }
    details.raw pre { margin: 0; padding: 0 12px 12px; overflow: auto; font: 12px/1.45 var(--mono); color: #334155; }
    .empty, .loading, .error {
      padding: 26px 18px;
      color: var(--ink-muted);
      text-align: center;
      line-height: 1.5;
    }
    .error { color: #b91c1c; }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--border-light);
      background: var(--panel);
      flex-shrink: 0;
      color: var(--ink-muted);
      font-size: 12px;
    }
    .pager button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--ink);
    }
    .pager button:disabled { opacity: 0.45; cursor: default; }
    @media (max-width: 1050px) {
      .grid.sessions, .grid.two-col { grid-template-columns: 1fr; }
      .pane { min-height: 300px; }
      .topbar { height: auto; padding: 16px; align-items: flex-start; flex-direction: column; }
      .brand { min-width: 0; }
      .top-tabs { width: 100%; flex-wrap: wrap; overflow-x: visible; }
      .top-tabs a { margin-left: 0; }
      .status-line {
        height: auto;
        min-height: 42px;
        flex-wrap: wrap;
        align-items: flex-start;
        padding: 10px 16px;
      }
      .viewer-body { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>AgentMemory Data Viewer</strong>
        <span>v__AGENTMEMORY_VERSION__ · read-only raw data browser</span>
      </div>
      <nav class="top-tabs" id="tabs" aria-label="Data types"></nav>
    </header>
    <div class="status-line" id="status-line">Loading data...</div>
    <main class="viewer-body" id="app"></main>
  </div>

  <script nonce="__AGENTMEMORY_VIEWER_NONCE__">
    (function() {
      'use strict';

      var PAGE_SIZE = 50;
      var FULL_LIST_LIMIT = 10000;
      var REST = window.location.origin;
      var TAB_IDS = ['sessions', 'lessons', 'summaries', 'observations', 'semantic', 'procedural', 'crystals', 'insights'];
      var TAB_CONFIG = {
        sessions: { label: 'Sessions' },
        lessons: { label: 'Lessons', path: 'lessons?limit=' + FULL_LIST_LIMIT, key: 'lessons' },
        summaries: { label: 'Summaries' },
        observations: { label: 'Observations' },
        semantic: { label: 'Semantic', path: 'semantic', key: 'semantic', fallbackKey: 'facts' },
        procedural: { label: 'Procedural', path: 'procedural', key: 'procedural', fallbackKey: 'procedures' },
        crystals: { label: 'Crystals', path: 'crystals?limit=500', key: 'crystals' },
        insights: { label: 'Insights', path: 'insights?limit=500', key: 'insights' }
      };
      var store = {
        activeTab: 'sessions',
        loaded: false,
        loading: false,
        error: '',
        sessions: [],
        cache: {},
        observationsBySession: {},
        selected: {
          sessionId: '',
          sessionCategory: 'summary',
          itemByTab: {},
          expandedByTab: {},
          observationSessionId: ''
        },
        filters: {},
        pages: {}
      };

      function esc(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
      function attr(value) { return esc(value); }
      function truncate(value, len) {
        var s = String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
        return s.length > len ? s.slice(0, len - 1) + '...' : s;
      }
      function formatDate(value) {
        if (!value) return '';
        try { return new Date(value).toLocaleString(); } catch { return String(value); }
      }
      function idOf(item) {
        if (!item) return '';
        return String(item.id || item.sessionId || item.memoryId || item.title || item.content || '');
      }
      function shortId(value) {
        var s = String(value || '');
        return s.length > 18 ? s.slice(0, 18) + '...' : s;
      }
      function asArray(value) {
        return Array.isArray(value) ? value : [];
      }
      function firstText(item, keys) {
        for (var i = 0; i < keys.length; i++) {
          var value = item && item[keys[i]];
          if (typeof value === 'string' && value.trim()) return value;
        }
        return '';
      }
      function countBadge(label, count, kind) {
        return '<span class="badge ' + (kind || '') + '">' + esc(label) + ': ' + esc(count) + '</span>';
      }
      function renderRaw(item) {
        return '<details class="raw"><summary>Raw JSON</summary><pre>' + esc(JSON.stringify(item, null, 2)) + '</pre></details>';
      }
      function renderTextBlock(text, empty) {
        return '<div class="text-block">' + esc(text || empty || 'No content') + '</div>';
      }
      function apiUrl(path) {
        return REST + '/agentmemory/' + path;
      }
      async function apiGet(path) {
        var res = await fetch(apiUrl(path), { method: 'GET', headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error(path + ' failed: ' + res.status);
        return await res.json();
      }
      function setStatus(html) {
        document.getElementById('status-line').innerHTML = html;
      }
      function setRoute(tab) {
        if (history.replaceState) history.replaceState(null, '', '#review-' + tab);
      }
      function tabFromHash() {
        var h = window.location.hash.replace(/^#review-/, '').replace(/^#/, '');
        return TAB_IDS.indexOf(h) >= 0 ? h : 'sessions';
      }

      async function init() {
        store.activeTab = tabFromHash();
        renderTabs();
        render();
        await loadBaseData();
        await ensureTabData(store.activeTab);
        render();
      }

      async function loadBaseData() {
        store.loading = true;
        store.error = '';
        render();
        try {
          var sessionsRes = await apiGet('sessions?agentId=*');
          store.sessions = asArray(sessionsRes.sessions);
          if (!store.selected.sessionId && store.sessions.length) {
            store.selected.sessionId = idOf(sortedSessions()[0]);
          }
          await Promise.all(['lessons', 'semantic', 'procedural', 'crystals', 'insights'].map(function(tab) {
            return ensureTabData(tab).catch(function() {});
          }));
          store.loaded = true;
        } catch (err) {
          store.error = err instanceof Error ? err.message : String(err);
        } finally {
          store.loading = false;
        }
      }

      async function ensureTabData(tab) {
        if (tab === 'sessions' || tab === 'summaries' || tab === 'observations') return;
        if (store.cache[tab]) return;
        var cfg = TAB_CONFIG[tab];
        if (!cfg || !cfg.path) {
          store.cache[tab] = [];
          return;
        }
        store.cache[tab] = { loading: true, items: [] };
        render();
        try {
          var res = await apiGet(cfg.path);
          store.cache[tab] = asArray(res[cfg.key] || (cfg.fallbackKey && res[cfg.fallbackKey]) || []);
        } catch (err) {
          store.cache[tab] = { error: err instanceof Error ? err.message : String(err), items: [] };
        }
      }

      async function loadObservationsForSession(sessionId) {
        if (!sessionId || store.observationsBySession[sessionId]) return;
        store.observationsBySession[sessionId] = { loading: true, items: [] };
        render();
        try {
          var res = await apiGet('observations?sessionId=' + encodeURIComponent(sessionId) + '&agentId=*');
          store.observationsBySession[sessionId] = { items: asArray(res.observations) };
        } catch (err) {
          store.observationsBySession[sessionId] = { error: err instanceof Error ? err.message : String(err), items: [] };
        }
      }

      function renderTabs() {
        var tabs = document.getElementById('tabs');
        tabs.innerHTML = TAB_IDS.map(function(tab) {
          var active = store.activeTab === tab ? ' active' : '';
          return '<button class="' + active + '" type="button" data-ui="tab" data-tab="' + attr(tab) + '">' + esc(TAB_CONFIG[tab].label) + '</button>';
        }).join('') + '<a href="/agentmemory/viewer">Classic Viewer</a>';
      }

      function render() {
        var app = document.getElementById('app');
        renderTabs();
        setStatus(statusHtml());
        if (store.error) {
          app.innerHTML = '<div class="pane"><div class="error">' + esc(store.error) + '</div></div>';
          return;
        }
        if (store.loading && !store.loaded) {
          app.innerHTML = '<div class="pane"><div class="loading">Loading sessions...</div></div>';
          return;
        }
        if (store.activeTab === 'sessions') {
          app.innerHTML = renderSessionsTab();
        } else if (store.activeTab === 'summaries') {
          app.innerHTML = renderTwoColumnTab('summaries', summaryItems());
        } else if (store.activeTab === 'observations') {
          app.innerHTML = renderObservationsTab();
        } else {
          app.innerHTML = renderTwoColumnTab(store.activeTab, tabItems(store.activeTab));
        }
      }

      function statusHtml() {
        var obsTotal = store.sessions.reduce(function(sum, s) { return sum + (Number(s.observationCount) || 0); }, 0);
        var pieces = [
          '<strong>' + esc(store.sessions.length) + '</strong> sessions',
          '<strong>' + esc(obsTotal) + '</strong> observations'
        ];
        ['lessons', 'semantic', 'procedural', 'crystals', 'insights'].forEach(function(tab) {
          var data = store.cache[tab];
          if (Array.isArray(data)) pieces.push('<strong>' + data.length + '</strong> ' + esc(tab));
        });
        return pieces.join('<span>·</span>') + '<span>read-only GET API</span>';
      }

      function sortedSessions() {
        return store.sessions.slice().sort(function(a, b) {
          return String(b.startedAt || '').localeCompare(String(a.startedAt || ''));
        });
      }
      function selectedSession() {
        return store.sessions.find(function(s) { return idOf(s) === store.selected.sessionId; }) || sortedSessions()[0] || null;
      }
      function summaryItems() {
        return store.sessions.map(function(s) {
          var summary = s.summary;
          if (summary && typeof summary === 'object') {
            return Object.assign({ id: idOf(s), sessionId: idOf(s) }, summary);
          }
          return {
            id: idOf(s),
            sessionId: idOf(s),
            title: firstText(s, ['firstPrompt']) || idOf(s),
            narrative: typeof summary === 'string' ? summary : '',
            observationCount: s.observationCount,
            project: s.project,
            startedAt: s.startedAt
          };
        });
      }
      function tabItems(tab) {
        var data = store.cache[tab];
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.items)) return data.items;
        return [];
      }
      function filterItems(tab, items) {
        var query = String(store.filters[tab] || '').toLowerCase().trim();
        if (!query) return items;
        return items.filter(function(item) {
          return JSON.stringify(item).toLowerCase().indexOf(query) >= 0;
        });
      }
      function pageItems(tab, items) {
        var page = store.pages[tab] || 0;
        var start = page * PAGE_SIZE;
        return items.slice(start, start + PAGE_SIZE);
      }
      function pagerHtml(tab, total) {
        var page = store.pages[tab] || 0;
        var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        return '<div class="pager"><button type="button" data-ui="page" data-tab="' + attr(tab) + '" data-dir="-1" ' + (page <= 0 ? 'disabled' : '') + '>Prev</button><span>Page ' + (page + 1) + ' / ' + pages + ' · ' + total + ' items</span><button type="button" data-ui="page" data-tab="' + attr(tab) + '" data-dir="1" ' + (page >= pages - 1 ? 'disabled' : '') + '>Next</button></div>';
      }

      function renderSessionsTab() {
        var session = selectedSession();
        return '<div class="grid sessions">' +
          renderSessionListPane() +
          renderSessionCategoryPane(session) +
          renderSessionContentPane(session) +
          '</div>';
      }
      function renderSessionListPane() {
        var sessions = filterItems('sessions', sortedSessions());
        return '<section class="pane"><div class="pane-head"><h2 class="pane-title">Sessions</h2><div class="pane-sub">Select a session, then inspect extracted categories.</div></div>' +
          renderSearch('sessions', 'Search session / prompt / project') +
          '<div class="list">' + (sessions.length ? sessions.map(renderSessionRow).join('') : renderEmpty('No sessions')) + '</div></section>';
      }
      function renderSessionRow(s) {
        var id = idOf(s);
        return '<button type="button" class="row ' + (id === store.selected.sessionId ? 'active' : '') + '" data-ui="select-session" data-id="' + attr(id) + '">' +
          '<div class="row-title"><span>' + esc(shortId(id)) + '</span><span>' + esc(s.observationCount || 0) + '</span></div>' +
          '<div class="row-meta">' + esc(formatDate(s.startedAt)) + '</div>' +
          '<div class="row-body">' + esc(truncate(s.firstPrompt || s.project || s.cwd || '', 140)) + '</div>' +
          '</button>';
      }
      function renderSessionCategoryPane(session) {
        var cats = sessionCategories(session);
        return '<section class="pane"><div class="pane-head"><h2 class="pane-title">Extraction Categories</h2><div class="pane-sub">Current session: ' + esc(session ? shortId(idOf(session)) : 'none') + '</div></div><div class="list">' +
          cats.map(function(c) {
            return '<button type="button" class="row ' + (store.selected.sessionCategory === c.id ? 'active' : '') + '" data-ui="session-category" data-category="' + attr(c.id) + '">' +
              '<div class="row-title"><span>' + esc(c.label) + '</span><span>' + esc(c.count) + '</span></div>' +
              '<div class="row-meta">' + esc(c.meta) + '</div></button>';
          }).join('') + '</div></section>';
      }
      function sessionCategories(session) {
        var sid = session ? idOf(session) : '';
        var obs = observationState(sid).items || [];
        return [
          { id: 'summary', label: 'Summary', count: session ? 1 : 0, meta: 'session summary from sessions API' },
          { id: 'observations', label: 'Observations', count: session ? (session.observationCount || obs.length || 0) : 0, meta: 'lazy loaded by sessionId' },
          { id: 'lessons', label: 'Lessons', count: relatedLessons(sid).length, meta: 'sourceIds when resolvable' },
          { id: 'semantic', label: 'Semantic', count: relatedBySession('semantic', sid, 'sourceSessionIds').length, meta: 'sourceSessionIds match' },
          { id: 'procedural', label: 'Procedural', count: relatedBySession('procedural', sid, 'sourceSessionIds').length, meta: 'sourceSessionIds match' },
          { id: 'crystals', label: 'Crystals', count: relatedBySession('crystals', sid, 'sessionId').length, meta: 'sessionId match' },
          { id: 'insights', label: 'Insights', count: tabItems('insights').length, meta: 'indirect source ids, not guessed' }
        ];
      }
      function observationState(sessionId) {
        return store.observationsBySession[sessionId] || { items: [] };
      }
      function relatedBySession(tab, sessionId, field) {
        if (!sessionId) return [];
        return tabItems(tab).filter(function(item) {
          var value = item && item[field];
          return Array.isArray(value) ? value.indexOf(sessionId) >= 0 : value === sessionId;
        });
      }
      function relatedLessons(sessionId) {
        if (!sessionId) return [];
        var obsState = observationState(sessionId);
        var obsIds = new Set((obsState.items || []).map(function(o) { return idOf(o); }));
        return tabItems('lessons').filter(function(l) {
          return asArray(l.sourceIds).some(function(id) { return obsIds.has(String(id)); });
        });
      }
      function renderSessionContentPane(session) {
        if (!session) return '<section class="pane"><div class="empty">No session selected</div></section>';
        var category = store.selected.sessionCategory || 'summary';
        var items = sessionCategoryItems(category, session);
        var title = TAB_CONFIG[category] ? TAB_CONFIG[category].label : category;
        if (category === 'summary') {
          return '<section class="pane"><div class="pane-head"><h2 class="pane-title">Content List: Summary</h2><div class="pane-sub">Click rows to expand detail.</div></div><div class="list">' + renderDetail(summaryItems().find(function(s) { return s.sessionId === idOf(session); }) || session, 'summaries') + '</div></section>';
        }
        return '<section class="pane"><div class="pane-head"><h2 class="pane-title">Content List: ' + esc(title) + '</h2><div class="pane-sub">Click an item to expand raw details.</div></div>' +
          renderSearch('session-' + category, 'Filter current category') +
          '<div class="list">' + renderItemList('session-' + category, items, category) + '</div>' +
          pagerHtml('session-' + category, filterItems('session-' + category, items).length) + '</section>';
      }
      function sessionCategoryItems(category, session) {
        var sid = idOf(session);
        if (category === 'observations') return observationState(sid).items || [];
        if (category === 'lessons') return relatedLessons(sid);
        if (category === 'semantic') return relatedBySession('semantic', sid, 'sourceSessionIds');
        if (category === 'procedural') return relatedBySession('procedural', sid, 'sourceSessionIds');
        if (category === 'crystals') return relatedBySession('crystals', sid, 'sessionId');
        if (category === 'insights') return tabItems('insights');
        return [];
      }

      function renderTwoColumnTab(tab, items) {
        var data = store.cache[tab];
        if (data && data.loading) return '<div class="pane"><div class="loading">Loading ' + esc(tab) + '...</div></div>';
        if (data && data.error) return '<div class="pane"><div class="error">' + esc(data.error) + '</div></div>';
        var filtered = filterItems(tab, items);
        var selectedId = store.selected.itemByTab[tab] || (filtered[0] && idOf(filtered[0])) || '';
        if (!store.selected.itemByTab[tab] && selectedId) store.selected.itemByTab[tab] = selectedId;
        var selected = filtered.find(function(item) { return idOf(item) === selectedId; }) || filtered[0] || null;
        return '<div class="grid two-col">' +
          '<section class="pane"><div class="pane-head"><h2 class="pane-title">' + esc(TAB_CONFIG[tab].label) + '</h2><div class="pane-sub">' + esc(items.length) + ' total items</div></div>' +
          renderSearch(tab, 'Search ' + TAB_CONFIG[tab].label.toLowerCase()) +
          '<div class="list">' + renderItemList(tab, items, tab, true) + '</div>' +
          pagerHtml(tab, filtered.length) + '</section>' +
          '<section class="pane"><div class="pane-head"><h2 class="pane-title">' + esc(TAB_CONFIG[tab].label) + ' Detail</h2><div class="pane-sub">Readable fields, source fields, and raw JSON.</div></div><div class="list">' +
          (selected ? renderDetail(selected, tab) : renderEmpty(tab === 'procedural' ? 'No procedural memories in this state.' : 'No item selected')) +
          '</div></section></div>';
      }
      function renderObservationsTab() {
        var sessionId = store.selected.observationSessionId || store.selected.sessionId || (sortedSessions()[0] && idOf(sortedSessions()[0])) || '';
        if (sessionId && !store.selected.observationSessionId) store.selected.observationSessionId = sessionId;
        var obs = observationState(sessionId).items || [];
        return '<div class="grid sessions">' +
          renderObservationFilterPane(sessionId) +
          '<section class="pane"><div class="pane-head"><h2 class="pane-title">Observation List</h2><div class="pane-sub">' + esc(obs.length || '') + ' loaded for current session.</div></div>' +
          renderSearch('observations', 'Search title / tool / file') +
          '<div class="list">' + renderItemList('observations', obs, 'observations', true) + '</div>' +
          pagerHtml('observations', filterItems('observations', obs).length) + '</section>' +
          '<section class="pane"><div class="pane-head"><h2 class="pane-title">Observation Detail</h2><div class="pane-sub">Select an observation to inspect raw fields.</div></div><div class="list">' + renderSelectedDetail('observations', obs) + '</div></section>' +
          '</div>';
      }
      function renderObservationFilterPane(activeSessionId) {
        return '<section class="pane"><div class="pane-head"><h2 class="pane-title">Observation Filters</h2><div class="pane-sub">Observations are loaded per session.</div></div><div class="list">' +
          sortedSessions().map(function(s) {
            var id = idOf(s);
            return '<button type="button" class="row ' + (id === activeSessionId ? 'active' : '') + '" data-ui="observation-session" data-id="' + attr(id) + '">' +
              '<div class="row-title"><span>' + esc(shortId(id)) + '</span><span>' + esc(s.observationCount || 0) + '</span></div>' +
              '<div class="row-meta">' + esc(truncate(s.firstPrompt || s.project || '', 120)) + '</div></button>';
          }).join('') + '</div></section>';
      }
      function renderSelectedDetail(tab, items) {
        var filtered = filterItems(tab, items);
        var selectedId = store.selected.itemByTab[tab] || (filtered[0] && idOf(filtered[0])) || '';
        var selected = filtered.find(function(item) { return idOf(item) === selectedId; }) || filtered[0] || null;
        return selected ? renderDetail(selected, tab) : renderEmpty('No item selected');
      }

      function renderSearch(key, placeholder) {
        return '<div class="pane-tools"><input class="search" data-ui="filter" data-key="' + attr(key) + '" type="search" placeholder="' + attr(placeholder) + '" value="' + attr(store.filters[key] || '') + '"></div>';
      }
      function renderItemList(key, items, type, selectMode) {
        var filtered = filterItems(key, items);
        var page = pageItems(key, filtered);
        if (!page.length) return renderEmpty('No items');
        return page.map(function(item) {
          var id = idOf(item);
          var selected = selectMode && store.selected.itemByTab[key] === id;
          var expanded = !selectMode && store.selected.expandedByTab[key] === id;
          var row = '<button type="button" class="row ' + (selected || expanded ? 'active' : '') + '" data-ui="' + (selectMode ? 'select-item' : 'expand-item') + '" data-key="' + attr(key) + '" data-type="' + attr(type) + '" data-id="' + attr(id) + '">' +
            '<div class="row-title"><span>' + esc(itemTitle(item, type)) + '</span></div>' +
            '<div class="row-meta">' + esc(itemMeta(item, type)) + '</div>' +
            '<div class="row-body">' + esc(truncate(itemBody(item, type), 160)) + '</div>' +
            renderBadges(item, type) + '</button>';
          return row + (expanded ? renderDetail(item, type) : '');
        }).join('');
      }
      function itemTitle(item, type) {
        if (type === 'summaries') return item.title || shortId(item.sessionId);
        if (type === 'observations') return item.title || item.toolName || shortId(item.id);
        if (type === 'semantic') return item.fact || shortId(item.id);
        if (type === 'crystals') return item.title || shortId(item.id);
        if (type === 'insights') return item.title || shortId(item.id);
        if (type === 'lessons') return item.content || shortId(item.id);
        if (type === 'procedural') return item.title || item.name || shortId(item.id);
        return item.title || item.content || item.id || 'item';
      }
      function itemMeta(item, type) {
        var parts = [];
        if (item.confidence != null) parts.push('confidence ' + item.confidence);
        if (item.updatedAt || item.createdAt || item.timestamp) parts.push(formatDate(item.updatedAt || item.createdAt || item.timestamp));
        if (item.sessionId) parts.push('session ' + shortId(item.sessionId));
        if (type === 'observations' && item.sourceEventIndex != null) parts.push('event ' + item.sourceEventIndex);
        return parts.join(' · ');
      }
      function itemBody(item, type) {
        if (type === 'summaries') return item.narrative || item.summary || '';
        if (type === 'semantic') return item.fact || '';
        if (type === 'crystals') return item.narrative || '';
        if (type === 'insights') return item.content || '';
        if (type === 'observations') return firstText(item, ['narrative', 'assistantResponse', 'userPrompt', 'toolOutput', 'toolInput']);
        return firstText(item, ['content', 'context', 'summary', 'description', 'narrative']);
      }
      function renderBadges(item, type) {
        var badges = [];
        if (item.sessionId) badges.push('<span class="badge green">sessionId</span>');
        if (asArray(item.sourceSessionIds).length) badges.push(countBadge('sourceSessionIds', item.sourceSessionIds.length, 'green'));
        if (asArray(item.sourceIds).length) badges.push(countBadge('sourceIds', item.sourceIds.length, 'amber'));
        if (asArray(item.sourceLessonIds).length) badges.push(countBadge('sourceLessonIds', item.sourceLessonIds.length, 'amber'));
        if (asArray(item.sourceCrystalIds).length) badges.push(countBadge('sourceCrystalIds', item.sourceCrystalIds.length, 'amber'));
        if (item.observationCount != null) badges.push(countBadge('observations', item.observationCount, ''));
        if (type === 'procedural' && !Object.keys(item || {}).length) badges.push('<span class="badge amber">empty</span>');
        return badges.length ? '<div class="badge-row">' + badges.join('') + '</div>' : '';
      }
      function renderDetail(item, type) {
        if (!item) return renderEmpty('No detail');
        return '<article class="detail"><h3>' + esc(itemTitle(item, type)) + '</h3>' +
          renderBadges(item, type) +
          '<div class="section"><div class="section-title">Content</div>' + renderTextBlock(itemBody(item, type), 'No readable content') + '</div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderSourceSection(item) {
        var fields = ['sessionId', 'sessionIds', 'sourceSessionIds', 'sourceIds', 'sourceMemoryIds', 'sourceLessonIds', 'sourceCrystalIds', 'sourceActionIds', 'sourceRunId', 'origin'];
        var rows = fields.filter(function(k) { return item && item[k] != null && item[k] !== ''; }).map(function(k) {
          var value = Array.isArray(item[k]) ? item[k].join(', ') : item[k];
          return '<div><span class="badge">' + esc(k) + '</span> <span class="row-meta">' + esc(truncate(value, 220)) + '</span></div>';
        });
        if (!rows.length) return '<div class="section"><div class="section-title">Source Support</div><div class="row-meta">No explicit source fields on this item.</div></div>';
        return '<div class="section"><div class="section-title">Source Support</div>' + rows.join('') + '</div>';
      }
      function renderEmpty(message) {
        return '<div class="empty">' + esc(message) + '</div>';
      }

      document.addEventListener('click', async function(e) {
        var target = e.target instanceof Element ? e.target.closest('[data-ui]') : null;
        if (!target) return;
        var ui = target.getAttribute('data-ui');
        if (ui === 'tab') {
          store.activeTab = target.getAttribute('data-tab') || 'sessions';
          setRoute(store.activeTab);
          await ensureTabData(store.activeTab);
          if (store.activeTab === 'observations') {
            store.selected.observationSessionId = store.selected.observationSessionId || store.selected.sessionId;
            await loadObservationsForSession(store.selected.observationSessionId);
          }
          render();
        } else if (ui === 'select-session') {
          store.selected.sessionId = target.getAttribute('data-id') || '';
          store.selected.sessionCategory = 'summary';
          render();
        } else if (ui === 'session-category') {
          var cat = target.getAttribute('data-category') || 'summary';
          store.selected.sessionCategory = cat;
          if (cat === 'observations') await loadObservationsForSession(store.selected.sessionId);
          if (cat === 'lessons') await loadObservationsForSession(store.selected.sessionId);
          await ensureTabData(cat);
          render();
        } else if (ui === 'observation-session') {
          store.selected.observationSessionId = target.getAttribute('data-id') || '';
          await loadObservationsForSession(store.selected.observationSessionId);
          render();
        } else if (ui === 'select-item') {
          var key = target.getAttribute('data-key') || '';
          store.selected.itemByTab[key] = target.getAttribute('data-id') || '';
          render();
        } else if (ui === 'expand-item') {
          var exKey = target.getAttribute('data-key') || '';
          var exId = target.getAttribute('data-id') || '';
          store.selected.expandedByTab[exKey] = store.selected.expandedByTab[exKey] === exId ? '' : exId;
          render();
        } else if (ui === 'page') {
          var pageKey = target.getAttribute('data-tab') || '';
          var dir = Number(target.getAttribute('data-dir') || 0);
          store.pages[pageKey] = Math.max(0, (store.pages[pageKey] || 0) + dir);
          render();
        }
      });
      document.addEventListener('input', function(e) {
        var target = e.target instanceof Element ? e.target.closest('[data-ui="filter"]') : null;
        if (!target) return;
        var key = target.getAttribute('data-key') || '';
        store.filters[key] = target.value || '';
        store.pages[key] = 0;
        render();
      });
      window.addEventListener('hashchange', async function() {
        store.activeTab = tabFromHash();
        await ensureTabData(store.activeTab);
        render();
      });

      init();
    })();
  </script>
</body>
</html>
