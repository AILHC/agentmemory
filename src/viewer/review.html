<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentMemory Data Viewer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-soft: #fbfcfe;
      --ink: #111827;
      --ink-muted: #64748b;
      --ink-faint: #94a3b8;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --active: #2563eb;
      --active-soft: #eff6ff;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --ui: Inter, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 14px;
    }
    .shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: #111827;
      color: #fff;
      flex-shrink: 0;
    }
    .back-link {
      height: 34px;
      border: 1px solid #374151;
      border-radius: 5px;
      background: #1f2937;
      color: #fff;
      padding: 0 12px;
      font: 700 13px var(--ui);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back-link:hover { border-color: #93c5fd; background: #263244; }
    .back-arrow { font-size: 18px; line-height: 1; }
    .brand { display: flex; flex-direction: column; min-width: 230px; }
    .brand strong { font-size: 18px; letter-spacing: 0; }
    .brand span { color: #cbd5e1; font-size: 11px; margin-top: 2px; }
    .top-tabs { display: flex; align-items: center; gap: 8px; overflow-x: auto; min-width: 0; flex: 1; }
    .top-tabs button {
      height: 34px;
      border: 1px solid #374151;
      border-radius: 5px;
      background: #263244;
      color: #fff;
      padding: 0 14px;
      font: 600 13px var(--ui);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }
    .top-tabs button.active { background: var(--active); border-color: var(--active); }
    .status-line {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-light);
      background: var(--panel);
      color: var(--ink-muted);
      flex-shrink: 0;
    }
    .status-line strong { color: var(--ink); }
    .viewer-body { padding: 24px; min-height: 0; flex: 1; overflow: hidden; }
    .grid { display: grid; gap: 18px; height: 100%; min-height: 0; overflow: hidden; }
    .grid.sessions { grid-template-columns: minmax(250px, 310px) minmax(230px, 300px) minmax(310px, 390px) minmax(420px, 1fr); }
    .grid.observations { grid-template-columns: minmax(270px, 330px) minmax(260px, 330px) minmax(420px, 1fr); }
    .grid.two-col { grid-template-columns: minmax(330px, 420px) minmax(520px, 1fr); }
    .pane {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 7px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .pane-head {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border-light);
      background: var(--panel-soft);
      flex-shrink: 0;
    }
    .pane-head-row { display: flex; align-items: center; gap: 10px; }
    .drill-back {
      display: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      height: 30px;
      padding: 0 10px;
      font: 700 12px var(--ui);
      cursor: pointer;
      flex-shrink: 0;
    }
    .pane-title { font-size: 17px; font-weight: 700; margin: 0; }
    .pane-sub { margin-top: 5px; color: var(--ink-muted); font-size: 12px; line-height: 1.35; }
    .pane-tools { padding: 12px 20px; border-bottom: 1px solid var(--border-light); background: var(--panel); }
    .search {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0 12px;
      font: 13px var(--ui);
      color: var(--ink);
      background: #fff;
    }
    .list { padding: 14px; overflow: auto; min-height: 0; flex: 1; }
    .row {
      width: 100%;
      text-align: left;
      display: block;
      border: 1px solid var(--border-light);
      background: var(--panel);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 10px;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }
    .row:hover { border-color: #93c5fd; }
    .row.active { background: var(--active-soft); border-color: #93c5fd; }
    .row-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
    .row-meta { margin-top: 6px; color: var(--ink-muted); font-size: 12px; line-height: 1.35; }
    .row-body { margin-top: 8px; color: #334155; font-size: 13px; line-height: 1.45; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 9px;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      background: #eef2ff;
      color: #334155;
      font-size: 11px;
      font-family: var(--mono);
    }
    .badge.green { background: var(--green-soft); border-color: var(--green-border); }
    .badge.amber { background: var(--amber-soft); border-color: var(--amber-border); }
    .detail {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      padding: 16px;
      margin-bottom: 12px;
    }
    .detail h3 { margin: 0 0 10px; font-size: 16px; }
    .section { margin-top: 14px; }
    .section-title { font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--ink-muted); letter-spacing: 0.05em; margin-bottom: 7px; }
    .detail-primary {
      margin-top: 14px;
      border: 1px solid #bae6fd;
      background: #f0f9ff;
      border-radius: 6px;
      padding: 14px;
    }
    .detail-primary .section-title { color: #075985; }
    .detail-secondary {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(220px, 0.8fr);
      gap: 14px;
      align-items: start;
    }
    .detail-drawer-root:empty { display: none; }
    .detail-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.24);
      display: flex;
      justify-content: flex-end;
    }
    .detail-drawer {
      width: min(760px, 56vw);
      height: 100%;
      background: #fff;
      border-left: 1px solid var(--border);
      box-shadow: -18px 0 40px rgba(15, 23, 42, 0.18);
      display: flex;
      flex-direction: column;
      min-width: 520px;
    }
    .detail-drawer-head {
      min-height: 64px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      background: var(--panel-soft);
      flex-shrink: 0;
    }
    .detail-drawer-title { margin: 0; font-size: 18px; line-height: 1.25; }
    .detail-drawer-sub { margin-top: 5px; color: var(--ink-muted); font-size: 12px; }
    .icon-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: 700 18px/1 var(--ui);
      flex-shrink: 0;
    }
    .detail-drawer-body { padding: 18px; overflow: auto; min-height: 0; }
    .text-block {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--panel);
      border: 1px solid var(--border-light);
      border-radius: 5px;
      padding: 10px 12px;
      line-height: 1.5;
      max-height: 220px;
      overflow: auto;
    }
    details.raw {
      margin-top: 14px;
      border: 1px solid var(--border-light);
      border-radius: 5px;
      background: var(--panel);
    }
    details.raw summary { cursor: pointer; padding: 10px 12px; font-weight: 700; color: var(--ink-muted); }
    details.raw pre { margin: 0; padding: 0 12px 12px; overflow: auto; font: 12px/1.45 var(--mono); color: #334155; }
    .empty, .loading, .error {
      padding: 26px 18px;
      color: var(--ink-muted);
      text-align: center;
      line-height: 1.5;
    }
    .error { color: #b91c1c; }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--border-light);
      background: var(--panel);
      flex-shrink: 0;
      color: var(--ink-muted);
      font-size: 12px;
    }
    .pager button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--ink);
    }
    .pager button:disabled { opacity: 0.45; cursor: default; }
    @media (max-width: 1050px) {
      .grid.sessions, .grid.observations, .grid.two-col { grid-template-columns: 1fr; }
      .grid { overflow: hidden; }
      .pane { display: none; min-height: 0; max-height: none; height: 100%; }
      .pane.mobile-active { display: flex; }
      .drill-back { display: inline-flex; align-items: center; }
      .detail-drawer { width: 100vw; min-width: 0; }
      .detail-secondary { grid-template-columns: 1fr; }
      .topbar { height: auto; padding: 16px; align-items: flex-start; flex-direction: column; }
      .brand { min-width: 0; }
      .top-tabs { width: 100%; flex-wrap: wrap; overflow-x: visible; }
      .status-line {
        height: auto;
        min-height: 42px;
        flex-wrap: wrap;
        align-items: flex-start;
        padding: 10px 16px;
      }
      .viewer-body { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="back-link" href="/agentmemory/viewer" aria-label="Return to classic viewer"><span class="back-arrow" aria-hidden="true">←</span><span>Classic Viewer</span></a>
      <div class="brand">
        <strong>AgentMemory Data Viewer</strong>
        <span>v__AGENTMEMORY_VERSION__ · read-only raw data browser</span>
      </div>
      <nav class="top-tabs" id="tabs" aria-label="Data types"></nav>
    </header>
    <div class="status-line" id="status-line">Loading data...</div>
    <main class="viewer-body" id="app"></main>
    <div class="detail-drawer-root" id="detail-drawer-root"></div>
  </div>

  <script nonce="__AGENTMEMORY_VIEWER_NONCE__">
    (function() {
      'use strict';

      var PAGE_SIZE = 50;
      var API_PAGE_SIZE = 500;
      var REST = window.location.origin;
      var TAB_IDS = ['sessions', 'lessons', 'summaries', 'observations', 'semantic', 'procedural', 'crystals', 'insights'];
      var TAB_CONFIG = {
        sessions: { label: 'Sessions' },
        lessons: { label: 'Lessons' },
        summaries: { label: 'Summaries' },
        observations: { label: 'Observations' },
        semantic: { label: 'Semantic' },
        procedural: { label: 'Procedural' },
        crystals: { label: 'Crystals' },
        insights: { label: 'Insights' }
      };
      var SESSION_SCOPE = {
        observations: true,
        lessons: true,
        semantic: true,
        procedural: true,
        crystals: true,
        insights: true,
      };
      var store = {
        activeTab: 'sessions',
        loaded: false,
        loading: false,
        error: '',
        sessions: [],
        meta: {},
        cache: {},
        observationsBySession: {},
        sessionItemsByType: {},
        sessionStatsById: {},
        selected: {
          sessionId: '',
          sessionCategory: 'summary',
          itemByTab: {},
          expandedByTab: {},
          observationSessionId: ''
        },
        drill: {
          sessions: 'sessions',
          observations: 'filters',
          tabById: {},
        },
        filters: {},
        pages: {},
      };

      var debug = window.__agentmemoryReviewDebug;
      if (debug && typeof debug === 'object') {
        debug.store = store;
      }

      function emitDebug(event, payload) {
        if (debug && typeof debug[event] === 'function') {
          debug[event](payload);
        }
      }

      function esc(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
      function attr(value) { return esc(value); }
      function truncate(value, len) {
        var s = String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
        return s.length > len ? s.slice(0, len - 1) + '...' : s;
      }
      function formatDate(value) {
        if (!value) return '';
        try { return new Date(value).toLocaleString(); } catch { return String(value); }
      }
      function safeList(value) {
        return Array.isArray(value) ? value : [];
      }
      function idOf(item) {
        if (!item) return '';
        return String(item.id || item.sessionId || item.memoryId || item.title || item.content || item.filepath || '');
      }
      function shortId(value) {
        var s = String(value || '');
        return s.length > 18 ? s.slice(0, 18) + '...' : s;
      }
      function firstText(item, keys) {
        for (var i = 0; i < keys.length; i++) {
          var value = item && item[keys[i]];
          if (typeof value === 'string' && value.trim()) return value;
        }
        return '';
      }
      function countBadge(label, count, kind) {
        return '<span class="badge ' + (kind || '') + '">' + esc(label) + ': ' + esc(count) + '</span>';
      }
      function isNarrowLayout() {
        if (window.matchMedia) return window.matchMedia('(max-width: 1050px)').matches;
        return window.innerWidth ? window.innerWidth <= 1050 : false;
      }
      function mobileActiveClass(view, active) {
        return isNarrowLayout() && view === active ? ' mobile-active' : '';
      }
      function tabDrillView(tab) {
        return store.drill.tabById[tab] || 'list';
      }
      function drillBackButton(target, label) {
        return '<button type="button" class="drill-back" data-ui="drill-back" data-target="' + attr(target) + '">‹ ' + esc(label) + '</button>';
      }
      function paneHead(title, subtitle, backTarget, backLabel) {
        return '<div class="pane-head"><div class="pane-head-row">' +
          (backTarget ? drillBackButton(backTarget, backLabel || 'Back') : '') +
          '<div><h2 class="pane-title">' + esc(title) + '</h2><div class="pane-sub">' + esc(subtitle || '') + '</div></div>' +
          '</div></div>';
      }
      function renderRaw(item) {
        return '<details class="raw"><summary>Raw JSON</summary><pre>' + esc(JSON.stringify(item, null, 2)) + '</pre></details>';
      }
      function renderTextBlock(text, empty) {
        return '<div class="text-block">' + esc(text || empty || 'No content') + '</div>';
      }
      function apiUrl(path) {
        return REST + '/agentmemory/' + path;
      }
      function apiGet(path) {
        return fetch(apiUrl(path), { method: 'GET', headers: { 'Accept': 'application/json' } }).then(function(res) {
          if (!res.ok) throw new Error(path + ' failed: ' + res.status);
          return res.json();
        });
      }
      function setStatus(html) {
        document.getElementById('status-line').innerHTML = html;
      }
      function setRoute(tab) {
        if (history.replaceState) history.replaceState(null, '', '#review-' + tab);
      }
      function tabFromHash() {
        var h = window.location.hash.replace(/^#review-/, '').replace(/^#/, '');
        return TAB_IDS.indexOf(h) >= 0 ? h : 'sessions';
      }
      function query(params) {
        return Object.keys(params).filter(function(k) {
          return params[k] !== undefined && params[k] !== null && params[k] !== '';
        }).map(function(k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(String(params[k]));
        }).join('&');
      }
      function getElementById(id) { return document.getElementById(id); }
      function ensureObject(obj) {
        if (!obj) return {};
        return obj;
      }
      function sessionScopedState(type, sessionId) {
        var bucket = ensureObject(store.sessionItemsByType[type]);
        store.sessionItemsByType[type] = bucket;
        var state = bucket[sessionId];
        if (!state) {
          state = { loading: false, error: '', items: [], total: 0 };
          bucket[sessionId] = state;
        }
        return state;
      }
      function observationState(sessionId) {
        var state = store.observationsBySession[sessionId];
        if (!state) {
          state = { loading: false, error: '', items: [], total: 0 };
          store.observationsBySession[sessionId] = state;
        }
        return state;
      }

      async function init() {
        store.activeTab = tabFromHash();
        renderTabs();
        render();
        await loadBaseData();
        await ensureTabData(store.activeTab);
        if (store.activeTab === 'observations') {
          store.selected.observationSessionId = store.selected.observationSessionId || store.selected.sessionId;
          if (store.selected.observationSessionId) {
            await loadObservationsForSession(store.selected.observationSessionId);
          }
        }
        if (store.selected.sessionId) {
          loadSessionStats(store.selected.sessionId);
        }
        render();
      }

      async function loadBaseData() {
        store.loading = true;
        store.error = '';
        render();
        try {
          var storesRes = await apiGet('viewer/stores');
          asArray(storesRes.stores).forEach(function(meta) {
            if (meta && meta.type) store.meta[meta.type] = meta;
          });
          var sessionsPage = await fetchStoreAll('sessions');
          store.sessions = asArray(sessionsPage.items);
          store.cache.sessions = sessionsPage;
          var summaries = await fetchStoreAll('summaries');
          store.cache.summaries = summaries;
          if (!store.selected.sessionId && store.sessions.length) {
            store.selected.sessionId = idOf(sortedSessions()[0]);
          }
          store.loaded = true;
        } catch (err) {
          store.error = err instanceof Error ? err.message : String(err);
        } finally {
          store.loading = false;
        }
      }

      async function ensureTabData(tab) {
        if (tab === 'sessions' || tab === 'observations') return;
        if (store.cache[tab]) return;
        store.cache[tab] = { loading: true, items: [] };
        try {
          store.cache[tab] = await fetchStoreAll(tab);
        } catch (err) {
          store.cache[tab] = { error: err instanceof Error ? err.message : String(err), items: [] };
        }
      }

      async function loadObservationsForSession(sessionId) {
        if (!sessionId) return;
        var state = observationState(sessionId);
        if (state.loading) return;
        if (state.loaded) return;
        state.loading = true;
        state.error = '';
        state.items = [];
        state.total = 0;
        try {
          var payload = await fetchStoreAll('observations', { sessionId: sessionId });
          state.items = asArray(payload.items);
          state.total = Number(payload.total || payload.returned || state.items.length) || 0;
          state.loaded = true;
        } catch (err) {
          state.error = err instanceof Error ? err.message : String(err);
        } finally {
          state.loading = false;
        }
      }

      async function ensureSessionData(type, sessionId) {
        if (!type || !sessionId || !SESSION_SCOPE[type]) return;
        if (type === 'observations') {
          await loadObservationsForSession(sessionId);
          return;
        }
        var state = sessionScopedState(type, sessionId);
        if (state.loading || state.loaded) return;
        state.loading = true;
        state.error = '';
        state.items = [];
        state.total = 0;
        try {
          var payload = await fetchStoreAll(type, { sessionId: sessionId });
          state.items = asArray(payload.items);
          state.total = Number(payload.total || payload.returned || state.items.length) || 0;
          state.loaded = true;
        } catch (err) {
          state.error = err instanceof Error ? err.message : String(err);
        } finally {
          state.loading = false;
        }
      }

      async function loadSessionStats(sessionId) {
        if (!sessionId) return;
        var current = store.sessionStatsById[sessionId];
        if (current && current.loading) return;
        if (current && current.loaded && !current.error) return;
        store.sessionStatsById[sessionId] = {
          loading: true,
          loaded: false,
          error: '',
          categories: {},
          sessionId: sessionId,
        };
        try {
          var result = await apiGet('viewer/session-stats?' + query({ sessionId: sessionId }));
          if (result && result.success) {
            store.sessionStatsById[sessionId] = {
              loading: false,
              loaded: true,
              error: '',
              categories: ensureObject(result.categories),
              sessionId: sessionId,
            };
          } else {
            throw new Error('session-stats response missing success flag');
          }
        } catch (err) {
          store.sessionStatsById[sessionId] = {
            loading: false,
            loaded: true,
            error: err instanceof Error ? err.message : String(err),
            categories: {},
            sessionId: sessionId,
          };
        }

        if (store.activeTab === 'sessions' && store.selected.sessionId === sessionId) {
          renderSessionCategoryPaneOnly();
          if (store.selected.sessionCategory !== 'summary') {
            renderSessionContentPaneOnly();
          }
        }
      }

      function sessionStat(state, category) {
        var stat = state && state.categories && state.categories[category];
        if (!stat) return null;
        if (stat.status === 'failed') return -1;
        if (typeof stat.count === 'number') return stat.count;
        return null;
      }

      function sessionCategoryCountText(session, category) {
        var sessionId = idOf(session);
        var state = sessionId ? store.sessionStatsById[sessionId] : null;
        var cached = sessionStat(state, category);
        if (cached === -1) return '!';
        if (state && state.error) return '!';
        if (cached !== null) return String(cached);
        return '...';
      }

      function sessionCategoryCount(session, category) {
        var sessionId = idOf(session);
        var state = sessionId ? store.sessionStatsById[sessionId] : null;
        if (!state || state.loading) return null;
        if (state.error) return -1;
        if (sessionStat(state, category) === -1) return -1;
        return sessionStat(state, category);
      }

      async function fetchStoreAll(type, extra) {
        var cursor = '';
        var items = [];
        var last = null;
        do {
          var params = Object.assign({ type: type, limit: API_PAGE_SIZE }, extra || {});
          if (cursor) params.cursor = cursor;
          last = await apiGet('viewer/store?' + query(params));

      function itemTitle(item, type) {

      function renderPrimarySection(label, content) {
        return '<div class="detail-primary"><div class="section-title">' + esc(label || 'Primary') + '</div>' +
          renderTextBlock(content, 'No primary content') + '</div>';
      }
      function renderMetaSection(rows) {
        return '<div class="section"><div class="section-title">Metadata</div>' + renderFieldRows(rows) + '</div>';
      }
      function renderDetail(item, type) {
        if (!item) return renderEmpty('No detail');
        if (type === 'summaries') return renderSummaryDetail(item);
        if (type === 'observations') return renderObservationDetail(item);
        if (type === 'semantic') return renderSemanticDetail(item);
        if (type === 'lessons') return renderLessonDetail(item);
        if (type === 'crystals') return renderCrystalDetail(item);
        if (type === 'insights') return renderInsightDetail(item);
        if (type === 'procedural') return renderProceduralDetail(item);
        return renderGenericDetail(item, type);
      }
      function renderSummaryDetail(item) {
        return '<article class="detail"><h3>' + esc(itemTitle(item, 'summaries')) + '</h3>' +
          renderPrimarySection('Summary', item.narrative || item.summary || item.title || '') +
          '<div class="detail-secondary"><div>' +
          renderMetaSection([
            ['title', item.title],
            ['createdAt', item.createdAt],
            ['updatedAt', item.updatedAt],
            ['observationCount', item.observationCount],
          ]) +
          '</div><div>' +
          '<div class="section"><div class="section-title">Supporting Fields</div>' +
          renderFieldRows([
            ['keyDecisions', item.keyDecisions, true],
            ['filesModified', item.filesModified, true],
            ['concepts', item.concepts, true],
          ]) + '</div></div></div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderObservationDetail(item) {
        return '<article class="detail"><h3>' + esc(itemTitle(item, 'observations')) + '</h3>' +
          renderPrimarySection('Observation Narrative', item.narrative || item.title || item.subtitle || '') +
          '<div class="detail-secondary"><div>' +
          renderMetaSection([
            ['title', item.title],
            ['subtitle', item.subtitle],
            ['type', item.type],
            ['importance', item.importance],
            ['confidence', item.confidence],
            ['timestamp', item.timestamp],
          ]) +
          '</div><div>' +
          '<div class="section"><div class="section-title">Extracted Signals</div>' +
          renderFieldRows([
            ['facts', item.facts, true],
            ['concepts', item.concepts, true],
            ['files', item.files, true],
          ]) + '</div></div></div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderSemanticDetail(item) {
        return '<article class="detail"><h3>' + esc(itemTitle(item, 'semantic')) + '</h3>' +
          renderPrimarySection('Semantic Fact', item.fact || '') +
          renderMetaSection([
            ['confidence', item.confidence],
            ['strength', item.strength],
            ['accessCount', item.accessCount],
            ['createdAt', item.createdAt],
            ['updatedAt', item.updatedAt],
          ]) +
          '<div class="section"><div class="section-title">Extraction</div>' +
          renderFieldRows([
            ['sourceSessionIds', item.sourceSessionIds, true],
            ['sourceMemoryIds', item.sourceMemoryIds, true],
            ['extractionRunId', item.extractionRunId],
            ['extractionWindowId', item.extractionWindowId],
          ]) + '</div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderLessonDetail(item) {
        return '<article class="detail"><h3>' + esc(itemTitle(item, 'lessons')) + '</h3>' +
          renderPrimarySection('Lesson', item.content || '') +
          renderMetaSection([
            ['name', item.name],
            ['context', item.context],
            ['confidence', item.confidence],
            ['reinforcements', item.reinforcements],
            ['source', item.source],
            ['origin', item.origin],
            ['tags', item.tags, true],
            ['createdAt', item.createdAt],
            ['updatedAt', item.updatedAt],
          ]) +
          '<div class="section"><div class="section-title">Source Links</div>' +
          renderFieldRows([
            ['sourceIds', item.sourceIds, true],
            ['sourceRunId', item.sourceRunId],
          ]) + '</div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderCrystalDetail(item) {
        return '<article class="detail"><h3>' + esc(itemTitle(item, 'crystals')) + '</h3>' +
          renderPrimarySection('Crystal Narrative', item.narrative || '') +
          '<div class="detail-secondary"><div>' +
          renderMetaSection([
            ['sessionId', item.sessionId],
            ['project', item.project],
            ['createdAt', item.createdAt],
          ]) +
          '</div><div>' +
          '<div class="section"><div class="section-title">Outcomes</div>' +
          renderFieldRows([
            ['keyOutcomes', item.keyOutcomes, true],
            ['filesAffected', item.filesAffected, true],
            ['lessons', item.lessons, true],
            ['sourceActionIds', item.sourceActionIds, true],
          ]) + '</div></div></div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderInsightDetail(item) {
        return '<article class="detail"><h3>' + esc(itemTitle(item, 'insights')) + '</h3>' +
          renderPrimarySection('Insight', item.content || item.title || '') +
          renderMetaSection([
            ['confidence', item.confidence],
            ['reinforcements', item.reinforcements],
            ['sourceConceptCluster', item.sourceConceptCluster, true],
            ['tags', item.tags, true],
            ['createdAt', item.createdAt],
            ['updatedAt', item.updatedAt],
          ]) +
          '<div class="section"><div class="section-title">Source Links</div>' +
          renderFieldRows([
            ['sourceMemoryIds', item.sourceMemoryIds, true],
            ['sourceLessonIds', item.sourceLessonIds, true],
            ['sourceCrystalIds', item.sourceCrystalIds, true],
          ]) + '</div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderProceduralDetail(item) {
        var steps = safeList(item.steps).map(function(step, index) {
          return '<li>' + esc(String(step || '')) + '</li>';
        }).join('');
        return '<article class="detail"><h3>' + esc(itemTitle(item, 'procedural')) + '</h3>' +
          renderPrimarySection('Trigger And Outcome', [item.triggerCondition, item.expectedOutcome].filter(Boolean).join('\n\n')) +
          renderMetaSection([
            ['name', item.name],
            ['frequency', item.frequency],
            ['strength', item.strength],
            ['tags', item.tags, true],
            ['concepts', item.concepts, true],
            ['createdAt', item.createdAt],
            ['updatedAt', item.updatedAt],
          ]) +
          '<div class="section"><div class="section-title">Steps</div>' +
          (steps ? '<ol>' + steps + '</ol>' : renderEmpty('No steps')) +
          '</div>' +
          '<div class="section"><div class="section-title">Source Links</div>' +
          renderFieldRows([
            ['sourceObservationIds', item.sourceObservationIds, true],
          ]) + '</div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderGenericDetail(item, type) {
        return '<article class="detail"><h3>' + esc(itemTitle(item, type)) + '</h3>' +
          '<div class="section"><div class="section-title">Details</div>' + renderTextBlock(JSON.stringify(item, null, 2), '') + '</div>' +
          renderSourceSection(item) +
          renderRaw(item) + '</article>';
      }
      function renderFieldRows(rows) {
        return rows.map(function(row) {
          var label = row[0];
          var value = row[1];
          var isArray = row[2] === true;
          if (value == null || value === '') return '';
          var rendered;
          if (isArray) {
            var values = safeList(value);
            if (!values.length) return '';
            rendered = values.map(function(v) { return esc(v); }).join(', ');
          } else {
            rendered = esc(String(value));
          }
          return '<div><span class="badge">' + esc(label) + '</span> <span class="row-meta">' + rendered + '</span></div>';
        }).join('');
      }
      function renderSourceSection(item) {
        var fields = [
          'sessionId',
          'sessionIds',
          'sourceSessionIds',
          'sourceObservationIds',
          'sourceIds',
          'sourceMemoryIds',
          'sourceLessonIds',
          'sourceCrystalIds',
          'sourceActionIds',
          'extractionRunId',
          'extractionWindowId',
          'extractionMark',
          'sourceRunId',
          'origin'
        ];
        var rows = fields.filter(function(k) {
          return item && item[k] != null && item[k] !== '';
        }).map(function(k) {
          var value = asArray(item[k]).length ? item[k].join(', ') : item[k];
          return '<div><span class="badge">' + esc(k) + '</span> <span class="row-meta">' + esc(truncate(value, 220)) + '</span></div>';
        });
        if (!rows.length) return '<div class="section"><div class="section-title">Source Support</div><div class="row-meta">No explicit source fields on this item.</div></div>';
        return '<div class="section"><div class="section-title">Source Support</div>' + rows.join('') + '</div>';
      }
      function renderEmpty(message) {
        return '<div class="empty">' + esc(message) + '</div>';
      }

      function selectedSessionItemFor(type, id) {
        var session = selectedSession();
        if (type === 'summaries') {
          var summary = sessionSummaryForSession(session);
          return idOf(summary) === id ? summary : null;
        }
        var category = store.selected.sessionCategory || type;
        return sessionCategoryItems(category, session).find(function(item) { return idOf(item) === id; }) || null;
      }
      function selectedItemFor(type, id, key) {
        if (!type || !id) return null;
        if (store.activeTab === 'sessions' || (key && key.indexOf('session-content:') === 0)) {
          return selectedSessionItemFor(type, id);
        }
        if (type === 'observations') {
          var sid = store.selected.observationSessionId || store.selected.sessionId;
          return (observationState(sid).items || []).find(function(item) { return idOf(item) === id; }) || null;
        }
        return tabItems(type).find(function(item) { return idOf(item) === id; }) || null;
      }
      function openDetailDrawer(item, type) {
        if (!item) return;
        var root = getElementById('detail-drawer-root');
        if (!root) return;
        root.innerHTML =
          '<div class="detail-backdrop" data-ui="close-detail">' +
            '<aside class="detail-drawer" role="dialog" aria-modal="true" aria-label="' + attr(itemTitle(item, type)) + '">' +
              '<div class="detail-drawer-head">' +
                '<div><h2 class="detail-drawer-title">' + esc(itemTitle(item, type)) + '</h2><div class="detail-drawer-sub">' + esc(TAB_CONFIG[type] ? TAB_CONFIG[type].label : type) + ' detail</div></div>' +
                '<button type="button" class="icon-button" data-ui="close-detail" aria-label="Close detail">x</button>' +
              '</div>' +
              '<div class="detail-drawer-body">' + renderDetail(item, type) + '</div>' +
            '</aside>' +
          '</div>';
      }
      function closeDetailDrawer() {
        var root = getElementById('detail-drawer-root');
        if (root) root.innerHTML = '';
      }

      function listContainerFromKey(key) {
        if (key === 'sessions') return getElementById('session-list-rows');
        if (key === 'observations') return getElementById('observation-list');
        if (key.indexOf('session-content:') === 0) return getElementById('session-content-list');
        return getElementById('tab-list');
      }
      function updateRowActive(container, selector, activeId, dataKey) {
        if (!container || !container.querySelectorAll) return;
        dataKey = dataKey || 'data-id';
        var rows = container.querySelectorAll(selector);
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];
          var value = row.getAttribute(dataKey || 'data-id') || '';
          if (value === activeId) {
            row.className = row.className.replace(/\bactive\b/g, '').trim() + ' active';
          } else {
            row.className = row.className.replace(/\bactive\b/g, '').trim();
          }
        }
      }
      async function ensureCategoryDataForRightPane(category, sessionId) {
        if (!sessionId) return;
        if (category === 'summary') return;
        await ensureSessionData(category, sessionId);
      }

      document.addEventListener('click', async function(e) {
        var target = e.target instanceof Element ? e.target.closest('[data-ui]') : null;
        if (!target) return;
        var ui = target.getAttribute('data-ui');
        if (ui === 'tab') {
          store.activeTab = target.getAttribute('data-tab') || 'sessions';
          setRoute(store.activeTab);
          await ensureTabData(store.activeTab);
          renderTabs();
          setStatus(statusHtml());
          if (store.activeTab === 'observations') {
            store.selected.observationSessionId = store.selected.observationSessionId || store.selected.sessionId;
            renderAppShellForActiveTab();
            renderObservationFilterPaneOnly();
            renderObservationListPaneOnly();
            renderObservationDetailPaneOnly();
            if (store.selected.observationSessionId) {
              var obsLoad = loadObservationsForSession(store.selected.observationSessionId);
              renderObservationListPaneOnly();
              renderObservationDetailPaneOnly();
              await obsLoad;
              if (store.activeTab === 'observations') {
                renderObservationListPaneOnly();
                renderObservationDetailPaneOnly();
              }
            }
          } else if (store.activeTab === 'sessions') {
            renderAppShellForActiveTab();
            renderSessionListPaneOnly();
            renderSessionCategoryPaneOnly();
            renderSessionContentPaneOnly();
            renderSessionDetailPaneOnly();
          } else {
            renderAppShellForActiveTab();
            renderTabListPaneOnly(store.activeTab);
            renderTabDetailPaneOnly(store.activeTab);
          }
        } else if (ui === 'select-session') {
          var sid = target.getAttribute('data-id') || '';
          store.selected.sessionId = sid;
          store.selected.sessionCategory = 'summary';
          store.selected.observationSessionId = sid;
          store.drill.sessions = isNarrowLayout() ? 'categories' : 'sessions';
          store.pages['session-content:summary'] = 0;
          loadSessionStats(sid);
          if (isNarrowLayout()) {
            renderAppShellForActiveTab();
            renderSessionListPaneOnly();
          } else {
            var list = getElementById('session-list');
            updateRowActive(list, '[data-ui="select-session"]', sid, 'data-id');
          }
          renderSessionCategoryPaneOnly();
          renderSessionContentPaneOnly();
          renderSessionDetailPaneOnly();
        } else if (ui === 'session-category') {
          var cat = target.getAttribute('data-category') || 'summary';
          store.selected.sessionCategory = cat;
          store.drill.sessions = isNarrowLayout() ? 'content' : store.drill.sessions;
          await ensureCategoryDataForRightPane(cat, store.selected.sessionId);
          if (isNarrowLayout()) {
            renderAppShellForActiveTab();
            renderSessionListPaneOnly();
            renderSessionCategoryPaneOnly();
          } else {
            var categoryPane = getElementById('session-category-list');
            updateRowActive(categoryPane, '[data-ui="session-category"]', cat, 'data-category');
          }
          renderSessionContentPaneOnly();
          renderSessionDetailPaneOnly();
        } else if (ui === 'observation-session') {
          var obsSessionId = target.getAttribute('data-id') || '';
          store.selected.observationSessionId = obsSessionId;
          store.drill.observations = isNarrowLayout() ? 'list' : store.drill.observations;
          updateRowActive(getElementById('observation-filter-list'), '[data-ui="observation-session"]', obsSessionId, 'data-id');
          await loadObservationsForSession(obsSessionId);
          if (store.activeTab === 'observations') {
            if (isNarrowLayout()) {
              renderAppShellForActiveTab();
              renderObservationFilterPaneOnly();
            }
            renderObservationListPaneOnly();
            renderObservationDetailPaneOnly();
          }
        } else if (ui === 'select-item') {
          var selectedKey = target.getAttribute('data-key') || '';
          var itemType = target.getAttribute('data-type') || '';
          var selectedId = target.getAttribute('data-id') || '';
          if (itemType) {
            store.selected.itemByTab[itemType] = selectedId;
          }
          if (selectedKey) {
            var container = listContainerFromKey(selectedKey);
            updateRowActive(container, '[data-ui="select-item"]', selectedId);
          }
          if (store.activeTab === 'sessions') {
            if (isNarrowLayout()) {
              store.drill.sessions = 'detail';
              renderAppShellForActiveTab();
              renderSessionListPaneOnly();
              renderSessionCategoryPaneOnly();
              renderSessionContentPaneOnly();
            }
            renderSessionDetailPaneOnly();
          } else if (store.activeTab === 'observations') {
            if (isNarrowLayout()) {
              store.drill.observations = 'detail';
              renderAppShellForActiveTab();
              renderObservationFilterPaneOnly();
              renderObservationListPaneOnly();
            }
            renderObservationDetailPaneOnly();
          } else {
            if (isNarrowLayout()) {
              store.drill.tabById[itemType] = 'detail';
              renderAppShellForActiveTab();
              renderTabListPaneOnly(itemType);
            }
            renderTabDetailPaneOnly(itemType);
          }
        } else if (ui === 'expand-item') {
          var exKey = target.getAttribute('data-key') || '';
          var exId = target.getAttribute('data-id') || '';
          var exType = target.getAttribute('data-type') || '';
          var willExpand = store.selected.expandedByTab[exKey] !== exId;
          store.selected.expandedByTab[exKey] = store.selected.expandedByTab[exKey] === exId ? '' : exId;
          var container = listContainerFromKey(exKey);
          updateRowActive(container, '[data-ui="expand-item"]', exId);
          if (store.activeTab === 'sessions') {
            renderSessionContentPaneOnly();
            renderSessionDetailPaneOnly();
          } else {
            renderTabListPaneOnly(store.activeTab);
            renderTabDetailPaneOnly(store.activeTab);
          }
        } else if (ui === 'page') {
          var pageKey = target.getAttribute('data-tab') || '';
          var dir = Number(target.getAttribute('data-dir') || 0);
          store.pages[pageKey] = Math.max(0, (store.pages[pageKey] || 0) + dir);
          if (store.activeTab === 'sessions') {
            renderSessionContentPaneOnly();
            renderSessionDetailPaneOnly();
          } else if (store.activeTab === 'observations') {
            renderObservationListPaneOnly();
            renderObservationDetailPaneOnly();
          } else {
            renderTabListPaneOnly(store.activeTab);
            renderTabDetailPaneOnly(store.activeTab);
          }
        } else if (ui === 'close-detail') {
          if (target === e.target || target.tagName === 'BUTTON') {
            closeDetailDrawer();
          }
        } else if (ui === 'drill-back') {
          var drillTarget = target.getAttribute('data-target') || 'list';
          if (store.activeTab === 'sessions') {
            store.drill.sessions = drillTarget;
            renderAppShellForActiveTab();
            renderSessionListPaneOnly();
            renderSessionCategoryPaneOnly();
            renderSessionContentPaneOnly();
            renderSessionDetailPaneOnly();
          } else if (store.activeTab === 'observations') {
            store.drill.observations = drillTarget;
            renderAppShellForActiveTab();
            renderObservationFilterPaneOnly();
            renderObservationListPaneOnly();
            renderObservationDetailPaneOnly();
          } else {
            store.drill.tabById[store.activeTab] = drillTarget;
            renderAppShellForActiveTab();
            renderTabListPaneOnly(store.activeTab);
            renderTabDetailPaneOnly(store.activeTab);
          }
        }
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeDetailDrawer();
      });
      document.addEventListener('input', function(e) {
        var target = e.target instanceof Element ? e.target.closest('[data-ui="filter"]') : null;
        if (!target) return;
        var key = target.getAttribute('data-key') || '';
        store.filters[key] = target.value || '';
        store.pages[key] = 0;
        if (key === 'sessions') {
          renderSessionListPaneOnly();
        } else if (key === 'observations' || key.indexOf('session-content:') === 0) {
          if (store.activeTab === 'sessions') {
            renderSessionContentPaneOnly();
            renderSessionDetailPaneOnly();
          }
          if (store.activeTab === 'observations') renderObservationListPaneOnly();
        } else if (store.activeTab === 'sessions') {
          renderSessionContentPaneOnly();
          renderSessionDetailPaneOnly();
        } else {
          renderTabListPaneOnly(store.activeTab);
          renderTabDetailPaneOnly(store.activeTab);
        }
      });
      window.addEventListener('resize', function() {
        clearTimeout(store.resizeTimer);
        store.resizeTimer = setTimeout(function() {
          render();
        }, 120);
      });
      window.addEventListener('hashchange', async function() {
        store.activeTab = tabFromHash();
        await ensureTabData(store.activeTab);
        render();
      });

      init();
    })();
  </script>
</body>
</html>
