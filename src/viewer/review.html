<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentMemory Data Viewer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-soft: #fbfcfe;
      --ink: #111827;
      --ink-muted: #64748b;
      --ink-faint: #94a3b8;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --active: #2563eb;
      --active-soft: #eff6ff;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --ui: Inter, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 14px;
    }
    .shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: #111827;
      color: #fff;
      flex-shrink: 0;
    }
    .back-link {
      height: 34px;
      border: 1px solid #374151;
      border-radius: 5px;
      background: #1f2937;
      color: #fff;
      padding: 0 12px;
      font: 700 13px var(--ui);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back-link:hover { border-color: #93c5fd; background: #263244; }
    .back-arrow { font-size: 18px; line-height: 1; }
    .brand { display: flex; flex-direction: column; min-width: 230px; }
    .brand strong { font-size: 18px; letter-spacing: 0; }
    .brand span { color: #cbd5e1; font-size: 11px; margin-top: 2px; }
    .top-tabs { display: flex; align-items: center; gap: 8px; overflow-x: auto; min-width: 0; flex: 1; }
    .top-tabs button {
      height: 34px;
      border: 1px solid #374151;
      border-radius: 5px;
      background: #263244;
      color: #fff;
      padding: 0 14px;
      font: 600 13px var(--ui);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }
    .top-tabs button.active { background: var(--active); border-color: var(--active); }
    .status-line {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-light);
      background: var(--panel);
      color: var(--ink-muted);
      flex-shrink: 0;
    }
    .status-line strong { color: var(--ink); }
    .viewer-body { padding: 24px; min-height: 0; flex: 1; overflow: hidden; }
    .grid { display: grid; gap: 18px; height: 100%; min-height: 0; overflow: hidden; }
    .grid.sessions { grid-template-columns: minmax(250px, 310px) minmax(230px, 300px) minmax(310px, 390px) minmax(420px, 1fr); }
    .grid.observations { grid-template-columns: minmax(270px, 330px) minmax(260px, 330px) minmax(420px, 1fr); }
    .grid.two-col { grid-template-columns: minmax(330px, 420px) minmax(520px, 1fr); }
    .pane {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 7px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .pane-head {
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border-light);
      background: var(--panel-soft);
      flex-shrink: 0;
    }
    .pane-head-row { display: flex; align-items: center; gap: 10px; }
    .drill-back {
      display: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      height: 30px;
      padding: 0 10px;
      font: 700 12px var(--ui);
      cursor: pointer;
      flex-shrink: 0;
    }
    .pane-title { font-size: 17px; font-weight: 700; margin: 0; }
    .pane-sub { margin-top: 5px; color: var(--ink-muted); font-size: 12px; line-height: 1.35; }
    .pane-tools { padding: 12px 20px; border-bottom: 1px solid var(--border-light); background: var(--panel); flex: 0 0 auto; }
    .search {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0 12px;
      font: 13px var(--ui);
      color: var(--ink);
      background: #fff;
    }
    .list { padding: 14px; overflow: auto; min-height: 0; flex: 1; }
    .list-rows { padding: 14px; overflow: auto; min-height: 0; flex: 1 1 auto; }
    .list-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .pane-pager { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--border-light); }
    .row {
      width: 100%;
      text-align: left;
      display: block;
      border: 1px solid var(--border-light);
      background: var(--panel);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 10px;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }
    .row:hover { border-color: #93c5fd; }
    .row.active { background: var(--active-soft); border-color: #93c5fd; }
    .row-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
    .row-meta { margin-top: 6px; color: var(--ink-muted); font-size: 12px; line-height: 1.35; }
    .row-body { margin-top: 8px; color: #334155; font-size: 13px; line-height: 1.45; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 9px;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      background: #eef2ff;
      color: #334155;
      font-size: 11px;
      font-family: var(--mono);
    }
    .badge.green { background: var(--green-soft); border-color: var(--green-border); }
    .badge.amber { background: var(--amber-soft); border-color: var(--amber-border); }
    .detail {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      padding: 16px;
      margin-bottom: 12px;
    }
    .detail h3 { margin: 0 0 10px; font-size: 16px; }
    .section { margin-top: 14px; }
    .section-title { font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--ink-muted); letter-spacing: 0.05em; margin-bottom: 7px; }
    .detail-primary {
      margin-top: 14px;
      border: 1px solid #bae6fd;
      background: #f0f9ff;
      border-radius: 6px;
      padding: 14px;
    }
    .detail-primary .section-title { color: #075985; }
    .detail-secondary {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(220px, 0.8fr);
      gap: 14px;
      align-items: start;
    }
    .detail-drawer-root:empty { display: none; }
    .detail-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.24);
      display: flex;
      justify-content: flex-end;
    }
    .detail-drawer {
      width: min(760px, 56vw);
      height: 100%;
      background: #fff;
      border-left: 1px solid var(--border);
      box-shadow: -18px 0 40px rgba(15, 23, 42, 0.18);
      display: flex;
      flex-direction: column;
      min-width: 520px;
    }
    .detail-drawer-head {
      min-height: 64px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      background: var(--panel-soft);
      flex-shrink: 0;
    }
    .detail-drawer-title { margin: 0; font-size: 18px; line-height: 1.25; }
    .detail-drawer-sub { margin-top: 5px; color: var(--ink-muted); font-size: 12px; }
    .icon-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: 700 18px/1 var(--ui);
      flex-shrink: 0;
    }
    .detail-drawer-body { padding: 18px; overflow: auto; min-height: 0; }
    .text-block {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--panel);
      border: 1px solid var(--border-light);
      border-radius: 5px;
      padding: 10px 12px;
      line-height: 1.5;
      max-height: 220px;
      overflow: auto;
    }
    details.raw {
      margin-top: 14px;
      border: 1px solid var(--border-light);
      border-radius: 5px;
      background: var(--panel);
    }
    details.raw summary { cursor: pointer; padding: 10px 12px; font-weight: 700; color: var(--ink-muted); }
    details.raw pre { margin: 0; padding: 0 12px 12px; overflow: auto; font: 12px/1.45 var(--mono); color: #334155; }
    .empty, .loading, .error {
      padding: 26px 18px;
      color: var(--ink-muted);
      text-align: center;
      line-height: 1.5;
    }
    .error { color: #b91c1c; }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--border-light);
      background: var(--panel);
      flex-shrink: 0;
      color: var(--ink-muted);
      font-size: 12px;
    }
    .pager button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--ink);
    }
    .pager button:disabled { opacity: 0.45; cursor: default; }
    @media (max-width: 1050px) {
      .grid.sessions, .grid.observations, .grid.two-col { grid-template-columns: 1fr; }
      .grid { overflow: hidden; }
      .pane { display: none; min-height: 0; max-height: none; height: 100%; }
      .pane.mobile-active { display: flex; }
      .drill-back { display: inline-flex; align-items: center; }
      .detail-drawer { width: 100vw; min-width: 0; }
      .detail-secondary { grid-template-columns: 1fr; }
      .topbar { height: auto; padding: 16px; align-items: flex-start; flex-direction: column; }
      .brand { min-width: 0; }
      .top-tabs { width: 100%; flex-wrap: wrap; overflow-x: visible; }
      .status-line {
        height: auto;
        min-height: 42px;
        flex-wrap: wrap;
        align-items: flex-start;
        padding: 10px 16px;
      }
      .viewer-body { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="back-link" href="/agentmemory/viewer" aria-label="Return to classic viewer"><span class="back-arrow" aria-hidden="true">←</span><span>Classic Viewer</span></a>
      <div class="brand">
        <strong>AgentMemory Data Viewer</strong>
        <span>v__AGENTMEMORY_VERSION__ · read-only raw data browser</span>
      </div>
      <nav class="top-tabs" id="tabs" aria-label="Data types"></nav>
    </header>
    <div class="status-line" id="status-line">Loading data...</div>
    <main class="viewer-body" id="app"></main>
    <div class="detail-drawer-root" id="detail-drawer-root"></div>
  </div>

  <script nonce="__AGENTMEMORY_VIEWER_NONCE__">
    (function() {
      'use strict';

      var PAGE_SIZE = 50;
      var REST = window.location.origin;
      var TAB_IDS = ['sessions', 'lessons', 'summaries', 'observations', 'semantic', 'procedural', 'crystals', 'insights'];
      var TAB_CONFIG = {
        sessions: { label: 'Sessions' },
        lessons: { label: 'Lessons' },
        summaries: { label: 'Summaries' },
        observations: { label: 'Observations' },
        semantic: { label: 'Semantic' },
        procedural: { label: 'Procedural' },
        crystals: { label: 'Crystals' },
        insights: { label: 'Insights' }
      };
      var SESSION_SCOPE = {
        observations: true,
        lessons: true,
        semantic: true,
        procedural: true,
        crystals: true,
        insights: true,
      };
      var store = {
        activeTab: 'sessions',
        loaded: false,
        loading: false,
        error: '',
        pageCache: {},
        activePageKeyByScope: {},
        requestSeqByScope: {},
        summaryBySessionId: {},
        selected: {
          sessionId: '',
          sessionCategory: 'summary',
          itemByTab: {},
          expandedByTab: {},
          observationSessionId: ''
        },
        drill: {
          sessions: 'sessions',
          observations: 'filters',
          tabById: {},
        },
        composingFilterKey: '',
        filters: {},
        searchTimers: {},
      };

      var debug = window.__agentmemoryReviewDebug;
      if (debug && typeof debug === 'object') {
        debug.store = store;
      }

      function emitDebug(event, payload) {
        if (debug && typeof debug[event] === 'function') {
          debug[event](payload);
        }
      }

      function esc(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
      function attr(value) { return esc(value); }
      function truncate(value, len) {
        var s = String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
        return s.length > len ? s.slice(0, len - 1) + '...' : s;
      }
      function formatDate(value) {
        if (!value) return '';
        try { return new Date(value).toLocaleString(); } catch { return String(value); }
      }
      function safeList(value) {
        return Array.isArray(value) ? value : [];
      }
      function idOf(item) {
        if (!item) return '';
        return String(item.id || item.sessionId || item.memoryId || item.title || item.content || item.filepath || '');
      }
      function shortId(value) {
        var s = String(value || '');
        return s.length > 18 ? s.slice(0, 18) + '...' : s;
      }
      function firstText(item, keys) {
        for (var i = 0; i < keys.length; i++) {
          var value = item && item[keys[i]];
          if (typeof value === 'string' && value.trim()) return value;
        }
        return '';
      }
      function countBadge(label, count, kind) {
        return '<span class="badge ' + (kind || '') + '">' + esc(label) + ': ' + esc(count) + '</span>';
      }
      function isNarrowLayout() {
        if (window.matchMedia) return window.matchMedia('(max-width: 1050px)').matches;
        return window.innerWidth ? window.innerWidth <= 1050 : false;
      }
      function mobileActiveClass(view, active) {
        return isNarrowLayout() && view === active ? ' mobile-active' : '';
      }
      function tabDrillView(tab) {
        return store.drill.tabById[tab] || 'list';
      }
      function drillBackButton(target, label) {
        return '<button type="button" class="drill-back" data-ui="drill-back" data-target="' + attr(target) + '">‹ ' + esc(label) + '</button>';
      }
      function paneHead(title, subtitle, backTarget, backLabel) {
        return '<div class="pane-head"><div class="pane-head-row">' +
          (backTarget ? drillBackButton(backTarget, backLabel || 'Back') : '') +
          '<div><h2 class="pane-title">' + esc(title) + '</h2><div class="pane-sub">' + esc(subtitle || '') + '</div></div>' +
          '</div></div>';
      }
      function renderRaw(item) {
        return '<details class="raw"><summary>Raw JSON</summary><pre>' + esc(JSON.stringify(item, null, 2)) + '</pre></details>';
      }
      function renderTextBlock(text, empty) {
        return '<div class="text-block">' + esc(text || empty || 'No content') + '</div>';
      }
      function apiUrl(path) {
        return REST + '/agentmemory/' + path;
      }
      function apiGet(path) {
        return fetch(apiUrl(path), { method: 'GET', headers: { 'Accept': 'application/json' } }).then(function(res) {
          if (!res.ok) throw new Error(path + ' failed: ' + res.status);
          return res.json();
        });
      }
      function setStatus(html) {
        document.getElementById('status-line').innerHTML = html;
      }
      function setRoute(tab) {
        if (history.replaceState) history.replaceState(null, '', '#review-' + tab);
      }
      function tabFromHash() {
        var h = window.location.hash.replace(/^#review-/, '').replace(/^#/, '');
        return TAB_IDS.indexOf(h) >= 0 ? h : 'sessions';
      }
      function query(params) {
        return Object.keys(params).filter(function(k) {
          return params[k] !== undefined && params[k] !== null && params[k] !== '';
        }).map(function(k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(String(params[k]));
        }).join('&');
      }
      function getElementById(id) { return document.getElementById(id); }

      async function init() {
        store.activeTab = tabFromHash();
        renderTabs();
        render();
        await loadBaseData();
        await ensureTabData(store.activeTab);
        if (store.selected.sessionId) {
          await loadSelectedSessionSummary(store.selected.sessionId);
        }
        render();
      }

      async function loadBaseData() {
        store.loading = true;
        store.error = '';
        render();
        try {
          var result = await loadStorePage({ scope: 'tab', type: 'sessions', page: 0, queryText: store.filters.sessions || '' });
          if (!result || !result.isActive) return;
          if (result.state.error) throw new Error(result.state.error);
          reconcileSessionSelectionAfterPageCommit(result.state.items, result.state.requestSeq);
          store.loaded = true;
        } catch (err) {
          store.error = err instanceof Error ? err.message : String(err);
        } finally {
          store.loading = false;
        }
      }

      async function ensureTabData(tab) {
        if (tab === 'sessions' || tab === 'observations') return;
        var current = activePageState('tab', tab);
        if (current && current.loaded && current.query === String(store.filters[tab] || '')) return;
        return loadStorePage({ scope: 'tab', type: tab, page: 0, queryText: store.filters[tab] || '' });
      }

      async function loadObservationsForSession(sessionId) {
        if (!sessionId) return;
        var current = activePageState('session-category', 'observations', sessionId);
        if (current && current.loaded) return { state: current, isActive: true };
        return loadStorePage({ scope: 'session-category', type: 'observations', sessionId: sessionId, page: 0, queryText: store.filters.observations || '' });
      }

      async function ensureSessionData(type, sessionId) {
        if (!type || !sessionId || !SESSION_SCOPE[type]) return;
        if (type === 'observations') {
          await loadObservationsForSession(sessionId);
          return;
        }
        var current = activePageState('session-category', type, sessionId);
        if (current && current.loaded) return { state: current, isActive: true };
        var key = 'session-content:' + sessionId + ':' + type;
        return loadStorePage({ scope: 'session-category', type: type, sessionId: sessionId, page: 0, queryText: store.filters[key] || '' });
      }

      async function loadSelectedSessionSummary(sessionId) {
        if (!sessionId) return;
        var state = store.summaryBySessionId[sessionId];
        if (state && (state.loading || state.loaded)) return;
        state = { loading: true, loaded: false, value: null, error: '', requestSeq: (state && state.requestSeq || 0) + 1 };
        store.summaryBySessionId[sessionId] = state;
        var requestSeq = state.requestSeq;
        try {
          var payload = await apiGet('viewer/store?' + query({ type: 'summaries', sessionId: sessionId, limit: 1, cursor: 0 }));
          if (state.requestSeq !== requestSeq) return;
          state.value = asArray(payload.items)[0] || null;
          state.loaded = true;
        } catch (err) {
          if (state.requestSeq === requestSeq) state.error = err instanceof Error ? err.message : String(err);
        } finally {
          if (state.requestSeq === requestSeq) state.loading = false;
        }
        if (store.activeTab === 'sessions' && store.selected.sessionId === sessionId) {
          renderSessionCategoryPaneOnly();
          if (store.selected.sessionCategory === 'summary') renderSessionContentPaneOnly();
        }
      }

      function reconcileSessionSelectionAfterPageCommit(items, requestSeq) {
        var state = activePageState('tab', 'sessions');
        if (!state || state.requestSeq !== requestSeq) return false;
        var current = items.find(function(item) { return idOf(item) === store.selected.sessionId; });
        store.selected.sessionId = current ? idOf(current) : (items[0] ? idOf(items[0]) : '');
        return true;
      }

      function sessionCategoryCountText(session, category) {
        var sessionId = idOf(session);
        if (!sessionId) return '—';
        if (category === 'summary') {
          var summaryState = store.summaryBySessionId[sessionId];
          if (!summaryState || summaryState.loading) return '...';
          if (summaryState.error) return '!';
          return summaryState.value ? '1' : '0';
        }
        if (category === 'observations') return String(Number(session.observationCount) || 0);
        var state = activePageState('session-category', category, sessionId);
        if (!state) return '—';
        if (state.error) return '!';
        if (state.loading && !state.loaded) return '...';
        return String(state.total);
      }

      function asArray(value) { return Array.isArray(value) ? value : []; }

      function emptyPageState() {
        return {
          items: [], total: 0, page: 0, limit: PAGE_SIZE, hasMore: false,
          query: '', loading: false, loaded: false, error: '', requestSeq: 0,
        };
      }

      function viewerPageKey(request) {
        return [
          request.scope,
          request.type,
          request.sessionId || '',
          String(request.queryText || '').trim().toLowerCase(),
        ].join('\u001f');
      }

      function viewerScopeKey(scope, type, sessionId) {
        return scope + ':' + type + ':' + (sessionId || '');
      }

      function activePageState(scope, type, sessionId) {
        var cacheKey = store.activePageKeyByScope[viewerScopeKey(scope, type, sessionId)];
        return cacheKey ? store.pageCache[cacheKey] || null : null;
      }

      function commitPageResult(request, state, requestSeq, payload) {
        if (state.requestSeq !== requestSeq) return false;
        state.items = asArray(payload.items);
        state.total = Number(payload.total || 0);
        state.page = Math.max(0, request.page);
        state.limit = PAGE_SIZE;
        state.hasMore = payload.hasMore === true;
        state.query = request.queryText || '';
        state.loaded = true;
        return true;
      }

      async function loadStorePage(request) {
        var cacheKey = viewerPageKey(request);
        var scopeKey = viewerScopeKey(request.scope, request.type, request.sessionId);
        var previousCacheKey = store.activePageKeyByScope[scopeKey];
        var state = store.pageCache[cacheKey] || emptyPageState();
        if (previousCacheKey && previousCacheKey !== cacheKey) delete store.pageCache[previousCacheKey];
        store.pageCache[cacheKey] = state;
        store.activePageKeyByScope[scopeKey] = cacheKey;
        var requestSeq = (store.requestSeqByScope[scopeKey] || 0) + 1;
        store.requestSeqByScope[scopeKey] = requestSeq;
        state.requestSeq = requestSeq;
        state.loading = true;
        state.error = '';
        var params = Object.assign({
          type: request.type,
          limit: PAGE_SIZE,
          cursor: String(Math.max(0, request.page) * PAGE_SIZE),
        }, request.sessionId ? { sessionId: request.sessionId } : {});
        if (request.queryText) params.query = request.queryText;

        try {
          var payload = await apiGet('viewer/store?' + query(params));
          if (state.requestSeq !== requestSeq || store.requestSeqByScope[scopeKey] !== requestSeq) return null;
          commitPageResult(request, state, requestSeq, payload);
          setStatus(statusHtml());
        } catch (err) {
          if (state.requestSeq === requestSeq && store.requestSeqByScope[scopeKey] === requestSeq) {
            state.error = err instanceof Error ? err.message : String(err);
          }
        } finally {
          if (state.requestSeq === requestSeq && store.requestSeqByScope[scopeKey] === requestSeq) state.loading = false;
        }
        return {
          state: state,
          cacheKey: cacheKey,
          isActive: store.activePageKeyByScope[scopeKey] === cacheKey && store.requestSeqByScope[scopeKey] === requestSeq,
        };
      }

      function pageRangeText(state) {
        if (!state || state.total === 0) return '0 / 0';
        var start = state.page * state.limit + 1;
        var end = Math.min(start + state.items.length - 1, state.total);
        return start + '-' + end + ' / ' + state.total;
      }

        var categories = session ? [
          { id: 'summary', label: 'Summary', countText: sessionCategoryCountText(session, 'summary'), meta: 'summary by sessionId' },
          { id: 'observations', label: 'Observations', countText: sessionCategoryCountText(session, 'observations'), meta: 'paged viewer-store by sessionId' },
          { id: 'lessons', label: 'Lessons', countText: sessionCategoryCountText(session, 'lessons'), meta: 'session-scoped viewer/store' },
          { id: 'semantic', label: 'Semantic', countText: sessionCategoryCountText(session, 'semantic'), meta: 'session-scoped viewer/store' },
          { id: 'procedural', label: 'Procedural', countText: sessionCategoryCountText(session, 'procedural'), meta: 'session-scoped viewer/store' },
          { id: 'crystals', label: 'Crystals', countText: sessionCategoryCountText(session, 'crystals'), meta: 'session-scoped viewer/store' },
          { id: 'insights', label: 'Insights', countText: sessionCategoryCountText(session, 'insights'), meta: 'session-scoped viewer/store' },

      function pagePagerHtml(state, scope, type, sessionId, key) {
        return '<div class="pager"><button type="button" data-ui="page-prev" data-scope="' + attr(scope) + '" data-type="' + attr(type) + '" data-session-id="' + attr(sessionId || '') + '" data-key="' + attr(key || type) + '" aria-label="Previous page" ' + (state.page <= 0 || state.loading ? 'disabled' : '') + '>Prev</button><span>' + esc(pageRangeText(state)) + '</span><button type="button" data-ui="page-next" data-scope="' + attr(scope) + '" data-type="' + attr(type) + '" data-session-id="' + attr(sessionId || '') + '" data-key="' + attr(key || type) + '" aria-label="Next page" ' + (!state.hasMore || state.loading ? 'disabled' : '') + '>Next</button></div>';

      function tabDataCountLabel(tab, fallback) {
        var state = activePageState('tab', tab);

        return '<input class="search" data-ui="filter" data-key="' + attr(key) + '" type="search" aria-label="Search ' + attr(key === 'observation-session-filter' ? 'sessions' : key) + '" placeholder="' + attr(placeholder) + '" value="' + attr(store.filters[key === 'observation-session-filter' ? 'sessions' : key] || '') + '">';

      function renderListForKey(key) {
        if (key === 'sessions') {
          renderSessionListPaneOnly();
          return;

        if (key === 'observation-session-filter') {
          renderObservationFilterPaneOnly();
          return;
        }
        if (key === 'observations') {
          renderObservationListPaneOnly();
          renderObservationDetailPaneOnly();
          return;
        }
        if (key.indexOf('session-content:') === 0) {
          renderSessionContentPaneOnly();
          renderSessionDetailPaneOnly();
          return;
        }
        renderTabListPaneOnly(key);
        renderTabDetailPaneOnly(key);
      }

      function searchRequestForKey(key) {
        if (key === 'observation-session-filter') {
          return { scope: 'tab', type: 'sessions', page: 0, queryText: store.filters.sessions || '' };
        }
        if (key.indexOf('session-content:') === 0) {
          var parts = key.split(':');
          return { scope: 'session-category', type: parts[2], sessionId: parts[1], page: 0, queryText: store.filters[key] || '' };
        }
        if (key === 'observations') {
          return { scope: 'session-category', type: 'observations', sessionId: store.selected.observationSessionId, page: 0, queryText: store.filters.observations || '' };
        }
        return { scope: 'tab', type: key, page: 0, queryText: store.filters[key] || '' };
      }

      function scheduleSearch(key) {
        clearTimeout(store.searchTimers[key]);
        store.searchTimers[key] = setTimeout(async function() {
          var request = searchRequestForKey(key);
          if (request.type === 'observations' && !request.sessionId) return;
          var resultPromise = loadStorePage(request);
          renderListForKey(key);
          var result = await resultPromise;
          if (!result || !result.isActive) return;
          if (key === 'sessions' && !result.state.error) {
            reconcileSessionSelectionAfterPageCommit(result.state.items, result.state.requestSeq);
            if (store.selected.sessionId) await loadSelectedSessionSummary(store.selected.sessionId);
          }
          renderListForKey(key);
          var rows = key === 'sessions'
            ? getElementById('session-list-rows')
            : key === 'observation-session-filter'
              ? getElementById('observation-filter-list')
              : key.indexOf('session-content:') === 0
                ? getElementById('session-content-list')
                : getElementById('tab-list-rows');
          if (rows) rows.scrollTop = 0;
        }, 300);
      }
      function renderSessionRow(s) {
        var id = idOf(s);
        return '<button type="button" class="row ' + (id === store.selected.sessionId ? 'active' : '') + '" data-ui="select-session" data-id="' + attr(id) + '">' +
          '<div class="row-title"><span>' + esc(shortId(id)) + '</span><span>' + esc(s.observationCount || 0) + '</span></div>' +
          '<div class="row-meta">' + esc(formatDate(s.startedAt)) + '</div>' +
          '<div class="row-body">' + esc(truncate(s.firstPrompt || s.project || s.cwd || '', 140)) + '</div>' +
          '</button>';

        var target = e.target instanceof Element ? e.target.closest('[data-ui="filter"]') : null;
        if (!target) return;
        store.composingFilterKey = target.getAttribute('data-key') || '';
      });
      document.addEventListener('compositionend', function(e) {
        var target = e.target instanceof Element ? e.target.closest('[data-ui="filter"]') : null;
        if (!target) return;
        var key = target.getAttribute('data-key') || '';
        store.composingFilterKey = '';
        store.filters[key === 'observation-session-filter' ? 'sessions' : key] = target.value || '';
        scheduleSearch(key);
      });
      window.addEventListener('resize', function() {
        clearTimeout(store.resizeTimer);
        store.resizeTimer = setTimeout(function() {
          render();
        }, 120);
      });
      window.addEventListener('hashchange', async function() {
        store.activeTab = tabFromHash();
        await ensureTabData(store.activeTab);
        render();
      });

      init();
    })();
  </script>
</body>
</html>
